# Параметры эмуляции энкодеров AS5048
wheel_encoders:
  ticks_per_revolution: 4096   # 12-битный энкодер (2^12)
  # ticks_per_revolution: 8192   # 13-битный энкодер
  # ticks_per_revolution: 16384  # 14-битный энкодер
  
  gear_ratio: 1.0              # Передаточное число редуктора (если есть)
  add_noise: true              # Добавлять шум энкодера
  noise_stddev: 2.0            # Стандартное отклонение шума (тики)
  publish_rate: 100            # Частота публикации (Гц)
